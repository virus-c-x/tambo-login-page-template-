<div class="main-container">
  <div class="card-box">
    <div class="left-panel">
      <div class="noise-texture"></div>

      <div class="brand-header">
        <img src="https://i.postimg.cc/Bv41RX4W/IMG-20250802-WA0037.jpg" class="logo-img" />
        <span>Virus Team</span>
      </div>

      <div class="hero-text">
        <div class="hero-title">Get Started with Us</div>
        <div class="hero-desc">
          Complete these easy steps to register your account.
        </div>

        <div class="step-list">
          <div class="step-item active-step">
            <div class="step-num">1</div>
            <span>Sign up your account</span>
          </div>
          <div class="step-item">
            <div class="step-num">2</div>
            <span>Set up your workspace</span>
          </div>
          <div class="step-item">
            <div class="step-num">3</div>
            <span>Set up your profile</span>
          </div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="form-wrapper">
        <div class="form-header-group">
          <div class="form-title">Sign Up Account</div>
          <div class="form-desc">
            Enter your personal data to create your account.
          </div>
        </div>

        <div class="social-btn-group">
          <button class="social-button">
            <!-- Google SVG -->
          </button>
          <button class="social-button">
            <!-- GitHub SVG -->
          </button>
        </div>

        <div class="divider-text">Or</div>

        <div class="row-inputs">
          <div class="input-box">
            <label class="input-label">First Name</label>
            <input class="input-field" type="text" placeholder="Your first name" />
          </div>
          <div class="input-box">
            <label class="input-label">Last Name</label>
            <input
              class="input-field"
              type="text"
              placeholder="Your Last Name"
            />
          </div>
        </div>

        <div class="input-box">
          <label class="input-label">Email</label>
          <input
            class="input-field"
            type="email"
            placeholder="viirusshop@gmail.com"
          />
        </div>

        <div class="input-box">
          <label class="input-label">Password</label>
          <div class="password-wrapper">
            <input
              class="input-field"
              type="password"
              placeholder="Enter your password"
            />
            <svg
              class="eye-icon"
              viewBox="0 0 24 24"
              width="20"
              fill="none"
              stroke="#666"
              stroke-width="2"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"
              ></path>
            </svg>
          </div>
        </div>

        <div class="hint-text">Must be at least 8 characters.</div>

        <button class="submit-button">Sign Up</button>

        <div class="footer-text">
          Already have an account? <a href="#">Log in</a>
        </div>
      </div>
    </div>
  </div>
</div>
